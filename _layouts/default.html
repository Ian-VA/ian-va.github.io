<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title and page.url != "/" %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..600;1,8..60,400..600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
  </head>
  <body>
    <nav>
      <a href="/" {% if page.url == "/" %}class="current"{% endif %}>about</a>
      <a href="/posts/" {% if page.url == "/posts/" %}class="current"{% endif %}>posts</a>
      <a href="/cv/" {% if page.url == "/cv/" %}class="current"{% endif %}>cv</a>
    </nav>
    <main>{{ content }}</main>
  </body>
</html>
